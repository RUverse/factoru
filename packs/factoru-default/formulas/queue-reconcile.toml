description = """
Production Factoru Queue reconciliation. One bounded Project Manager planner
step reads authoritative Factoru tasks through scoped tools, reconciles the
requested Queue revision, and records structured planning decisions. Factoru
serializes this formula to one active pass per project.
"""
formula = "queue-reconcile"
version = 2
target_required = false

[requires]
formula_compiler = ">=2.0.0"

[catalog]
name = "queue-reconcile"
description = "Reconcile one coalesced Factoru project Queue revision."

[vars.project_id]
description = "Stable Factoru project identity for correlation."
required = true
type = "string"

[vars.reconciliation_id]
description = "Idempotent Factoru reconciliation command identity."
required = true
type = "string"

[vars.queue_revision]
description = "Highest coalesced Queue revision this pass must reconcile."
required = true
type = "int"

[vars.planner_target]
description = "Rig-scoped Project Manager planner binding."
default = "factoru.project-manager-planner"
type = "string"

[[steps]]
id = "reconcile"
title = "Reconcile Queue revision {{queue_revision}}"
metadata = { "gc.run_target" = "{{planner_target}}" }
description = """
Reconcile Factoru project {{project_id}} through Queue revision
{{queue_revision}} (request {{reconciliation_id}}).

Use factoru_tasks_search with query "*" to read the deterministic bounded
active/recent candidate set, then make the structured semantic duplicate
judgment. A clear match from a new user request must use
factoru_tasks_append_evidence to add provenance-bearing request/scope evidence
to the existing task without creating a card. Uncertain matches and every
task-to-task consolidation must use factoru_tasks_propose_merge for user
confirmation. For every Queue task, split 2–8 linked children when necessary,
record bounded resource intents, set priority, project-local dependencies, Software Engineering plus an
allowed Formula Preset, and exactly one Queue phase. Preserve every user-locked
workflow choice. For an unlocked task, keep the project default unless the
task's scope clearly calls for the other allowed preset: Standard Build is the
full lifecycle and Fast Patch is the bounded small-change flow. Use Ready only
when the task is actionable and dependencies are satisfied; use Waiting for
capacity when another task already occupies the WIP-one execution slot. Never
move a task to In progress: Factoru reserves that transition for an accepted
execution run. Never silently merge. If a user decision is necessary, move the task to Needs you
with the exact action and question.

All durable changes must use Factoru tools. Do not edit SQLite, infer another
project, or treat Gas City bead state as a Kanban column. Finish after one
bounded pass; do not poll or loop waiting for more work.
"""
