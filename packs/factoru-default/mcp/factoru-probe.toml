# Milestone 1 Factoru probe tool.
#
# Gas City projects this into each harness's own MCP config at session start:
# `<workdir>/.codex/config.toml` for Codex, `<workdir>/.mcp.json` for Claude.
# The `name` must equal this file's stem; the loader enforces that.
name = "factoru-probe"
command = "node"
args = ["assets/probe-tool/server.mjs"]

# The probe refuses to start without a token, and binds it to one project and
# one role. These are fixed development values: real Factoru tokens are
# short-lived, issued per session, and never written into a pack.
[env]
FACTORU_PROBE_TOKEN = "m1-probe-token"
FACTORU_PROBE_PROJECT = "probe"
FACTORU_PROBE_ROLE = "software-implementer"
