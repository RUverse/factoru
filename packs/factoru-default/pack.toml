[pack]
name = "factoru-default"
version = "0.1.0"
schema = 2

# Milestone 1 provisional pack.
#
# This pack exists to prove the Gas City dependency, not to define Factoru's
# production behaviour. It declares the four intended agent roles and one tiny
# implement-then-independent-review formula. Queue and task semantics are
# deliberately absent: they are Factoru product concepts and arrive with the
# task model in Milestone 4.
#
# Agent role names are stable because Factoru's adapter routes to them, but
# their prompts, tool policy, and model bindings are expected to change once
# the Worker Type contract is promoted in Milestone 3.
