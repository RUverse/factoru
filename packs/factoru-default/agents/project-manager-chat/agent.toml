description = "Factoru Project Manager chat: the user-facing conversation for one project"
scope = "rig"

# This portable definition is the source contract. Gas City 1.4.0 external
# messages require a city-scoped named-session-backed agent and reject a
# rig-scoped binding. Factoru therefore generates one distinct local agent from
# this contract per project and adds an always-on `[[named_session]]` in the
# dedicated city's root pack. The generated identity has a cap of one so two
# contexts never answer as one Project Manager.
max_active_sessions = 1
