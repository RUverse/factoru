packages:
  - apps/*
  - packages/*
  - packs/*
  - templates/*

# Build scripts are opt-in. esbuild ships a platform-specific binary and is the
# dependencies that legitimately need one. Electron 43 no longer uses an
# install hook; `apps/desktop` downloads its runtime through `install-electron`
# when the application is actually run.
allowBuilds:
  better-sqlite3: true
  electron: false
  esbuild: true

# Keep dependency resolution strict so package boundaries are enforced by the
# module resolver and not only by review.
linkWorkspacePackages: true

# pnpm 11's pre-run dependency verification treats the downloaded Node runtime
# as a reason to purge an otherwise current modules directory. Installs and the
# frozen lockfile remain authoritative; scripts use the pinned runtime through
# node_modules/.bin without an unnecessary reinstall prompt.
verifyDepsBeforeRun: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - typescript-eslint@8.66.0
